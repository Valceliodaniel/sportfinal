name: Gerar APK Sportech Real

on:
  workflow_dispatch:
    inputs:
      club_name:
        description: 'Nome do Clube (ex: Ajax Handebol)'
        required: true
        default: 'Ajax Handebol'
      club_url:
        description: 'URL do Club App (ex: https://google.com)'
        required: true
        default: 'https://google.com'
      app_id:
        description: 'ID do App na Sportech'
        required: true
        default: 'ajax-001'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Injetar Configuracoes do Clube
        run: |
          sed -i 's|const val CLUB_URL = ".*"|const val CLUB_URL = "${{ github.event.inputs.club_url }}"|g' app/src/main/java/com/sportech/base/AppConfig.kt
          sed -i 's|const val APP_ID = ".*"|const val APP_ID = "${{ github.event.inputs.app_id }}"|g' app/src/main/java/com/sportech/base/AppConfig.kt
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">${{ github.event.inputs.club_name }}</string>|g' app/src/main/res/values/strings.xml

      - name: Gerar Wrapper e Compilar APK
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ github.event.inputs.app_id }}
          path: app/build/outputs/apk/debug/app-debug.apk